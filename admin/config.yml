          - { label: "League", name: "league", widget: "select", options: ["Hertfordshire County League", "SW Herts League"] }
          - { label: "Division", name: "division", widget: "string" }
          - { label: "Captain", name: "captain", widget: "string" }
          - { label: "Champions?", name: "champions", widget: "boolean", default: false }
          - label: "Fixtures"
            name: "fixtures"
            widget: "list"
            fields:
              - { label: "Date", name: "date", widget: "string" }
              - { label: "Opposition", name: "opposition", widget: "string" }
              - { label: "Start Time", name: "start", widget: "string" }
              - { label: "Venue", name: "venue", widget: "string" }
              - { label: "Result", name: "result", widget: "string", hint: "e.g. Won 7–2 / Lost 3–6 / Drew 4–4 / TBP" }

      - name: "mixed1"
        label: "Mixed 1 (Herts County)"
