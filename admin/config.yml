      - name: "mensfour"
        label: "Men's Four (SWHBL)"
        file: "_data/teams/mensfour.json"
        fields:
          - { label: "Team Name", name: "name", widget: "string", default: "Men's Four" }
          - { label: "League", name: "league", widget: "select", options: ["Hertfordshire County League", "SW Herts League"] }
          - { label: "Division", name: "division", widget: "string" }
          - { label: "Captain", name: "captain", widget: "string" }
          - { label: "Champions?", name: "champions", widget: "boolean", default: false }
          - label: "Fixtures"
            name: "fixtures"
            widget: "list"
            fields:
              - { label: "Date", name: "date", widget: "string" }
              - { label: "Opposition", name: "opposition", widget: "string" }
              - { label: "Start Time", name: "start", widget: "string" }
              - { label: "Venue", name: "venue", widget: "string" }
              - { label: "Result", name: "result", widget: "string", hint: "e.g. Won 7–2 / Lost 3–6 / Drew 4–4 / TBP" }

  # ─────────────────────────────────────────
  # RECENT RESULTS (shown on homepage)
  # ─────────────────────────────────────────
  - name: "recent_results"
    label: "Recent Results (Homepage)"
    files:
      - name: "recent"
        label: "Recent Results"
        file: "_data/recent_results.json"
        fields:
          - label: "Results"
            name: "results"
            widget: "list"
            max: 6
            fields:
              - { label: "Team", name: "team", widget: "string", hint: "e.g. Men's 1" }
              - { label: "Opposition", name: "opposition", widget: "string" }
              - { label: "Home Score", name: "home_score", widget: "number" }
              - { label: "Away Score", name: "away_score", widget: "number" }
              - { label: "Date", name: "date", widget: "string", hint: "e.g. 30 Apr 2026" }
              - { label: "Outcome", name: "outcome", widget: "select", options: ["win", "loss", "draw"] }
